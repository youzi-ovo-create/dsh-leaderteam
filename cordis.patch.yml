# Standard dsh.bundle composition layer for `dsh plugin add dsh-leaderteam` (Linux, macOS, Windows).
# Mounts the version-guarded final safety gate (`dsh-leaderteam/native-executor` + `dsh-leaderteam/core`),
# modular governance/scheduler/archive/panel services, and the LeaderTeam / member presets.
- id: tool-executor-native
  disabled: true
- insert:
    - id: tool-executor-native
      name: dsh-leaderteam/native-executor
    - id: leaderteam-core
      name: dsh-leaderteam/core
      config:
        surface: desktop
        modular: true
    - id: leaderteam-scheduler
      name: dsh-leaderteam/scheduler
    - id: leaderteam-timer-archive
      name: dsh-leaderteam/timer-archive
    - id: leaderteam-consensus
      name: dsh-leaderteam/consensus
    - id: dsh-leaderteam
      name: dsh-leaderteam
    - id: preset-leaderteam
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: leaderteam
        name: LeaderTeam
        description: 分权自治多Agent协作、0ms确定性安全门与四维物理Token账本
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are the LeaderTeam leader, powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config: {maxBytes: 65536}
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config: {write: false, edit: false}
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config: {sampleOverCapGlobResults: false}
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config: {allowParallelInProgress: true}
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config: {fetch: true, searchTimeoutMs: 60000}
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: compaction
            name: cordis:group
            group: true
            isolate: {compaction: true, toolResultPruner: true}
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config: {thresholdChars: 8192, headChars: 4096, tailChars: 1024}
          - id: leaderteam-lead
            name: dsh-leaderteam/lead
    - id: preset-lt-member-readonly
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: lt-member-readonly
        name: LeaderTeam 成员（只读）
        order: 90
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a LeaderTeam member, powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config: {maxBytes: 65536}
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config: {write: false, edit: false}
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config: {sampleOverCapGlobResults: false}
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config: {allowParallelInProgress: true}
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config: {fetch: true, searchTimeoutMs: 60000}
          - id: compaction
            name: cordis:group
            group: true
            isolate: {compaction: true, toolResultPruner: true}
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config: {thresholdChars: 8192, headChars: 4096, tailChars: 1024}
    - id: preset-lt-member-code
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: lt-member-code
        name: LeaderTeam 成员（代码）
        order: 91
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a LeaderTeam member, powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config: {maxBytes: 65536}
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config: {sampleOverCapGlobResults: false}
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config: {allowParallelInProgress: true}
          - id: compaction
            name: cordis:group
            group: true
            isolate: {compaction: true, toolResultPruner: true}
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config: {thresholdChars: 8192, headChars: 4096, tailChars: 1024}
    - id: preset-lt-member-shell
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: lt-member-shell
        name: LeaderTeam 成员（代码+命令行）
        order: 92
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a LeaderTeam member, powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config: {maxBytes: 65536}
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config: {sampleOverCapGlobResults: false}
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config: {allowParallelInProgress: true}
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config: {fetch: true, searchTimeoutMs: 60000}
          - id: compaction
            name: cordis:group
            group: true
            isolate: {compaction: true, toolResultPruner: true}
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config: {thresholdChars: 8192, headChars: 4096, tailChars: 1024}
