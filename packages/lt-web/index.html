<!doctype html>
<html lang="zh-CN" data-lt-theme="white">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leader Team — 工程治理与模型工作台</title>
    <script>
      (function bootLtTheme() {
        function hexToRgb(hex) {
          var m = String(hex || '').trim().replace(/^#/, '');
          if (m.length === 3) {
            return [parseInt(m[0] + m[0], 16), parseInt(m[1] + m[1], 16), parseInt(m[2] + m[2], 16)];
          }
          if (m.length >= 6) {
            return [parseInt(m.slice(0, 2), 16), parseInt(m.slice(2, 4), 16), parseInt(m.slice(4, 6), 16)];
          }
          return null;
        }
        function relLum(rgb) {
          if (!rgb) return null;
          var norm = rgb.map(function (v) {
            var c = v / 255;
            return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
          });
          return 0.2126 * norm[0] + 0.7152 * norm[1] + 0.0722 * norm[2];
        }
        try {
          var raw = localStorage.getItem('lt-ui-preferences-v1');
          if (!raw) return;
          var prefs = JSON.parse(raw);
          var allowed = ['white', 'dark', 'heluoxu', 'custom'];
          var theme = prefs && allowed.indexOf(prefs.theme) >= 0 ? prefs.theme : 'white';
          var html = document.documentElement;
          var root = html.style;
          html.setAttribute('data-lt-theme', theme);
          if (theme === 'custom' && prefs.customTheme) {
            var ct = prefs.customTheme;
            html.setAttribute('data-lt-heading', ct.headingFontMode === 'sans' ? 'sans' : 'serif');
            html.setAttribute(
              'data-lt-corners',
              ['sharp', 'balanced', 'pill-cta'].indexOf(ct.cornerStyle) >= 0 ? ct.cornerStyle : 'balanced'
            );
            html.setAttribute(
              'data-lt-density',
              ['compact', 'standard', 'comfortable'].indexOf(ct.density) >= 0 ? ct.density : 'standard'
            );
            if (ct.canvasColor) root.setProperty('--user-bg-canvas', ct.canvasColor);
            if (ct.surfaceColor) root.setProperty('--user-bg-surface', ct.surfaceColor);
            if (ct.inkColor) root.setProperty('--user-fg-primary', ct.inkColor);
            if (ct.accentColor) root.setProperty('--user-accent', ct.accentColor);
            if (ct.dangerColor) root.setProperty('--user-danger', ct.dangerColor);
            var inkLum = relLum(hexToRgb(ct.inkColor));
            root.setProperty('--user-fg-on-ink', inkLum !== null && inkLum > 0.45 ? '#141619' : '#FFFFFF');
            var surfLum = relLum(hexToRgb(ct.surfaceColor));
            var isDarkSurf = surfLum !== null && surfLum < 0.25;
            root.colorScheme = isDarkSurf ? 'dark' : 'light';
            var semProps = [
              '--lt-info',
              '--lt-info-bg',
              '--lt-success',
              '--lt-success-bg',
              '--lt-warning',
              '--lt-warning-bg',
              '--lt-danger',
              '--lt-danger-bg',
              '--lt-seal'
            ];
            if (isDarkSurf) {
              var dLum = relLum(hexToRgb(ct.dangerColor));
              var ratio =
                dLum !== null
                  ? (Math.max(dLum, surfLum) + 0.05) / (Math.min(dLum, surfLum) + 0.05)
                  : 0;
              var safeDanger = ratio >= 4.5 && ct.dangerColor ? ct.dangerColor : '#DF7A72';
              root.setProperty('--lt-info', '#6CB2CE');
              root.setProperty('--lt-info-bg', 'color-mix(in srgb, #6CB2CE 16%, var(--lt-bg-surface))');
              root.setProperty('--lt-success', '#63B692');
              root.setProperty('--lt-success-bg', 'color-mix(in srgb, #63B692 16%, var(--lt-bg-surface))');
              root.setProperty('--lt-warning', '#E0AD56');
              root.setProperty('--lt-warning-bg', 'color-mix(in srgb, #E0AD56 16%, var(--lt-bg-surface))');
              root.setProperty('--lt-danger', safeDanger);
              root.setProperty('--lt-danger-bg', 'color-mix(in srgb, ' + safeDanger + ' 16%, var(--lt-bg-surface))');
              root.setProperty('--lt-seal', safeDanger);
            } else {
              for (var i = 0; i < semProps.length; i++) root.removeProperty(semProps[i]);
            }
          } else {
            html.removeAttribute('data-lt-heading');
            html.removeAttribute('data-lt-corners');
            html.removeAttribute('data-lt-density');
            var clearProps = [
              '--lt-info',
              '--lt-info-bg',
              '--lt-success',
              '--lt-success-bg',
              '--lt-warning',
              '--lt-warning-bg',
              '--lt-danger',
              '--lt-danger-bg',
              '--lt-seal'
            ];
            for (var j = 0; j < clearProps.length; j++) root.removeProperty(clearProps[j]);
            root.removeProperty('color-scheme');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
